# Permission tiers, budgets, and caps. Validated at startup and in CI by
# `chuck validate`. Unknown keys fail. An action may appear in only one
# permission tier, and any route that matches an ask_first action must route
# to the human tier.

permissions:
  act_freely:
    - read
    - triage
    - comment_issue
    - update_notion_next_step
    - append_notion_log
    - open_draft_pr
  act_then_notify:
    - create_issue
    - mark_pr_ready
    - change_task_status
  ask_first:
    - merge
    - deploy
    - spend
    - send_external
    - delete
    - mark_done

budgets:
  # Daily spend per model tier. When hit, work queues and Clark is notified.
  # Every model tier is required; there is no "unlimited".
  daily_usd:
    haiku: 5    # placeholder: not set in the design
    sonnet: 15
    opus: 10
  # Any single spend above this needs approval (ask_first: spend).
  spend_approval_threshold_usd: 5   # placeholder: not set in the design

caps:
  task_max_iterations: 10     # placeholder: not set in the design
  worker_max_wall_clock: 2h   # placeholder: reaper destroys workers older than this
  reaper_interval: 5m         # placeholder
